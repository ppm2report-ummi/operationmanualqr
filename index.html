<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Generator with Logo</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
    .entry { margin: 10px auto; padding: 10px; border: 1px solid #ccc; width: 600px; }
    label { display: inline-block; width: 100px; text-align: right; margin-right: 10px; }
    input { padding: 5px; width: 400px; margin-bottom: 5px; }
    button { padding: 8px 12px; margin: 5px; }
    canvas { margin-top: 20px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <div id="entries"></div>
  <button onclick="addEntry()">Add Link</button>
  <button onclick="removeEntry()">Remove Link</button>
  <br><br>
  <button onclick="generateAll()">Generate All QR Codes</button>
  <div id="results"></div>

  <!-- QRCode.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const entriesDiv = document.getElementById("entries");
    const resultsDiv = document.getElementById("results");

    const logoImg = new Image();
    logoImg.src = "ummilogo.png"; // must be in same folder

    function addEntry() {
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `
        <label>Name:</label><input type="text" class="name" placeholder="Enter Name"><br>
        <label>Link:</label><input type="text" class="link" placeholder="Enter Link"><br>
        <label>Instruction:</label><input type="text" class="instruction" value="Scan for Operation Manual"><br>
      `;
      entriesDiv.appendChild(div);
    }

    function removeEntry() {
      if (entriesDiv.lastChild) entriesDiv.removeChild(entriesDiv.lastChild);
    }

    function generateAll() {
      resultsDiv.innerHTML = "";
      const entries = document.querySelectorAll(".entry");
      entries.forEach((entry) => {
        const name = entry.querySelector(".name").value.trim();
        const link = entry.querySelector(".link").value.trim();
        const instruction = entry.querySelector(".instruction").value.trim();
        if (!name || !link) return;

        // Create QR
        const qrDiv = document.createElement("div");
        new QRCode(qrDiv, {
          text: link,
          width: 300,
          height: 300,
          colorDark: "#4B0082",
          colorLight: "#ffffff"
        });

        setTimeout(() => {
          const qrCanvas = qrDiv.querySelector("canvas");
          if (!qrCanvas) return;

          const qrWidth = qrCanvas.width;
          const qrHeight = qrCanvas.height;
          const topSpace = 80, bottomSpace = 80;

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = qrWidth;
          canvas.height = qrHeight + topSpace + bottomSpace;

          ctx.fillStyle = "white";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(qrCanvas, 0, topSpace);

          // Overlay logo if available
          if (logoImg.complete) {
            const logoSize = qrWidth * 0.20;
            const x = (qrWidth - logoSize) / 2;
            const y = topSpace + (qrHeight - logoSize) / 2;
            ctx.drawImage(logoImg, x, y, logoSize, logoSize);
          }

          // Text scaling
          const titleFontSize = Math.max(qrWidth / 10, 20);
          const smallFontSize = Math.max(qrWidth / 14, 16);

          ctx.fillStyle = "#4B0082";
          ctx.textAlign = "center";
          ctx.font = `${titleFontSize}px Arial`;
          ctx.fillText(name, qrWidth / 2, titleFontSize);

          ctx.font = `${smallFontSize}px Arial`;
          ctx.fillText(instruction, qrWidth / 2, qrHeight + topSpace + smallFontSize + 10);

          // Add download button
          const container = document.createElement("div");
          container.appendChild(canvas);
          const downloadBtn = document.createElement("button");
          downloadBtn.textContent = "Download PNG";
          downloadBtn.onclick = () => {
            const linkEl = document.createElement("a");
            linkEl.download = `${name.replace(/\s+/g,"_")}.png`;
            linkEl.href = canvas.toDataURL("image/png");
            linkEl.click();
          };
          container.appendChild(downloadBtn);
          resultsDiv.appendChild(container);
        }, 500);
      });
    }

    addEntry(); // start with one entry
  </script>
</body>
</html>
